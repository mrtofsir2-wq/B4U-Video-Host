name: Build Video Quality Variants

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to process (example: v0.1.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Select release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "tag=${INPUT_TAG:-$RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download MP4 assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p input output
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir input

      - name: Create size-controlled variants
        run: |
          set -e
          for src in input/*.mp4; do
            [ -e "$src" ] || continue
            base="$(basename "$src" .mp4)"
            width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$src" || echo 0)
            height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$src" || echo 0)
            echo "Processing $base (${width}x${height})"

            # Keep the original. Generate only resolutions that are not larger than the source.
            if [ "$height" -ge 360 ]; then
              ffmpeg -y -i "$src" -vf "scale=-2:360" -c:v libx264 -preset veryfast -crf 27 -c:a aac -b:a 96k -movflags +faststart "output/${base}.360p.mp4"
            fi
            if [ "$height" -ge 480 ]; then
              ffmpeg -y -i "$src" -vf "scale=-2:480" -c:v libx264 -preset veryfast -crf 26 -c:a aac -b:a 96k -movflags +faststart "output/${base}.480p.mp4"
            fi
            if [ "$height" -ge 720 ]; then
              ffmpeg -y -i "$src" -vf "scale=-2:720" -c:v libx264 -preset veryfast -crf 25 -c:a aac -b:a 128k -movflags +faststart "output/${base}.720p.mp4"
            fi
            if [ "$height" -ge 1080 ]; then
              ffmpeg -y -i "$src" -vf "scale=-2:1080" -c:v libx264 -preset veryfast -crf 24 -c:a aac -b:a 128k -movflags +faststart "output/${base}.1080p.mp4"
            fi
          done

      - name: Upload variants to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(output/*.mp4)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}" --clobber
          else
            echo "No variants needed for the supplied videos."
          fi
