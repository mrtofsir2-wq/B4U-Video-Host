<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>B4U Video Host</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header><h1>B4U Video Host</h1><span>VIDEO LIST TEST</span></header>
    <section class="player-card">
      <video id="video" controls playsinline preload="metadata"></video>
      <h2 id="video-title">Loading…</h2>
      <p id="status">Loading video list…</p>
    </section>
    <section class="library">
      <div class="library-head"><h2>Videos</h2><span id="count"></span></div>
      <div id="video-list" class="video-list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
